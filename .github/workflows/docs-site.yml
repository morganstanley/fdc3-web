name: Documentation site

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - 'site/**'
            - 'projects/fdc3-web/src/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/docs-site.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # Keep in sync with NODE_VERSION in .github/workflows/build.yml.
            NODE_VERSION: '24'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      site/package-lock.json
            - name: Install library and site dependencies
              run: |
                  npm ci
                  npm --prefix site ci
            - name: Build and validate the documentation site
              run: |
                  npm run docs:check
                  npm run docs:build
            - name: Configure GitHub Pages
              uses: actions/configure-pages@b37a0207cd3856d15c17aab233a6517f68f57f4c # v5.0.0
            - name: Upload the site
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f3d02f9b0 # v3.0.1
              with:
                  path: site/dist

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
